    <h1>看过期隐私政策</h1>
    <p>生效日期：2026年11月17日</p>
    <p>看过期不需要账号。你填写的物品名称、开封日、到期日，以及选用的图标和包装照片，保存在设备本机，用来展示物品、计算剩余天数、显示小组件和安排提醒。提醒设置也保存在本机。</p>
    <p>照片由你主动拍摄或从相册选择。App 没有开发者服务器，不会上传这些内容，也不会将它们分享给第三方。提醒由系统在本机发出。</p>
    <p>物品记录会保留到你删除为止。你可以在首页左滑删除记录及其照片副本，也可以编辑物品并选择「移除照片」。这些操作不会删除相册中的原图。你可以随时在 iOS「设置」中关闭相机或通知权限。</p>
    <p>联系：jsondata@163.com</p>
</body>
